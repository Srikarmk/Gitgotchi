[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitgotchi"
dynamic = ["version"]
description = "A Stardew Valley X Halloween-inspired terminal companion for your git repository"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "M K Sai Srikar", email = "Srikarmks@gmail.com"}
]
keywords = [
    "git",
    "terminal",
    "pet",
    "companion",
    "stardew-valley",
    "ai",
    "tamagotchi",
    "devtools",
    "halloween"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Games/Entertainment :: Simulation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "rich>=13.7.0",
    "gitpython>=3.1.40",
    "anthropic>=1.0.0",
    "sqlalchemy>=2.0.36",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
    "ruff>=0.6",
]

[project.scripts]
gitgotchi = "gitgotchi.cli:cli"

[project.urls]
Homepage = "https://github.com/Srikarmk/Gitgotchi"
Repository = "https://github.com/Srikarmk/Gitgotchi"
Issues = "https://github.com/Srikarmk/Gitgotchi/issues"
Changelog = "https://github.com/Srikarmk/Gitgotchi/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "gitgotchi.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
